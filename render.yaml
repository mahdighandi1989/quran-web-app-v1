# Render Blueprint — deploys BOTH the web app and the Telegram bot server.
# Use it via Render → New → "Blueprint" and point it at this repo. After it provisions,
# fill in the env vars marked `sync: false` (their values are secrets you provide once).
#
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE (2026-11-02, measured via the Render API): the two live services were created BY HAND, not
# from this blueprint, so this file does not drive them — their dashboard settings do. Differences:
#   quran-web-app      build `npm install && npx vite build --base=/ && echo '/*  /index.html 200' > dist/_redirects`,
#                      and NO rewrite rule (deep links answer HTTP 404 and recover via public/404.html);
#   quran-telegram-bot plan `starter` (paid, always on), not `free`.
services:
  # 1) The static web app (Vite build). SPA routing handled by routes/_redirects/static.json.
  - type: web
    runtime: static
    name: quran-web-app
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Firebase web config. These have safe in-code fallbacks, so they are OPTIONAL — set
      # them only to override per environment. (A Firebase web API key is not a secret.)
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      # OPTIONAL backend AI proxy URL so provider API keys never reach the browser bundle.
      # Set this to the bot service's public URL (it serves POST /api/ai/proxy). Leave unset to
      # fall back to direct bring-your-own-key calls from the browser. See server/README.md.
      - key: VITE_AI_PROXY_URL
        sync: false
      # OPTIONAL «نظارت و سرکشی» API base (defaults to VITE_AI_PROXY_URL, then the bot's public URL).
      - key: VITE_INSPECTION_API_URL
        sync: false
    routes:
      # 2026-11-05: Firebase auth on THIS domain (same-site sign-in; set on the live service via the Render API,
      # priority 0 — before the SPA fallback). Takes effect once VITE_FIREBASE_AUTH_DOMAIN is this host.
      - type: rewrite
        source: /__/auth/*
        destination: https://quran-app-7566b.firebaseapp.com/__/auth/*
      # SPA fallback: serve index.html for any client-side route (e.g. /settings) on refresh.
      - type: rewrite
        source: /*
        destination: /index.html

  # 2) The Telegram bot webhook server (two-way control). Reads/writes the app's Firestore.
  - type: web
    runtime: node
    name: quran-telegram-bot
    rootDir: server
    plan: starter          # the live service's plan (see the note at the top)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # from @BotFather — REQUIRED
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true  # random; also pass it to setWebhook (see server/README.md)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false          # the service-account JSON (one line) — for Firestore access
      # «نظارت و سرکشی»: admins (comma-separated verified Google emails) and the supervisor's password.
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPERVISOR_PASSWORD
        sync: false          # random; create it on Render, never in the repo
      # Drive offline access (2026-11-08, server/driveOffline.mjs). Both secret, set by the owner on Render only:
      #   GOOGLE_OAUTH_CLIENT_SECRET = the «Web client (auto created by Google Service)» secret (Google Cloud › Credentials)
      #   DRIVE_TOKEN_KEY            = random, ≥ 32 characters; encrypts the stored refresh tokens. NEVER change it later
      #                                (stored grants become unreadable ⇒ one more «اتصال»).
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: DRIVE_TOKEN_KEY
        generateValue: true
      # OPTIONAL: the supervisor routines' UTC schedules for the board's «next round» bar (defaults in server/lib/rounds.mjs:
      # urgent every 3 hours `23 */3 * * *`, full round `47 0 * * 1,4`). Leave unset unless a routine's schedule changes.
      - key: SUPERVISOR_URGENT_CRON
        sync: false
      - key: SUPERVISOR_FULL_CRON
        sync: false
